# Included at server AND location scope so other add_header directives cannot
# silently remove this policy through nginx inheritance.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
