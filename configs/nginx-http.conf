        index index.html;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }
    location ~ "^/watch(?:/[0-9a-f]{32})?$" {
        include /etc/nginx/dnscheck/security-headers.conf;
        try_files /watch.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }
    location = /man.css {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/man.css;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }
    location ^~ /js/ {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/js/;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }

    location ~ "^/dns/[0-9A-Za-z._-]+/[0-9A-Za-z]+$" {
        include /etc/nginx/dnscheck/security-headers.conf;
        limit_req zone=addr_lookups burst=20 nodelay;
        proxy_pass http://unix:/var/lib/dnscheck/addrd.sock:;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Addr-Client-IP $remote_addr;
    }

}
server {
    include /etc/nginx/dnscheck/security-headers.conf;

    include /etc/nginx/dnscheck/listen_https.conf;
    server_name www.dnscheck.tools;
    ssl_certificate /var/lib/dnscheck-certificates/live/addr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/addr.tools/privkey.pem;
    location / {
        include /etc/nginx/dnscheck/security-headers.conf;
        add_header Cache-Control "max-age=2592000";
        return 301 https://dnscheck.tools$request_uri;
    }
}
server {
    include /etc/nginx/dnscheck/security-headers.conf;

    include /etc/nginx/dnscheck/listen_https.conf;
    server_name ws.dnscheck.tools;
    ssl_certificate /var/lib/dnscheck-certificates/live/addr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/addr.tools/privkey.pem;
    location / {
        include /etc/nginx/dnscheck/security-headers.conf;
        return 400;
    }
    location ~ "^/watch/[0-9a-f]{32}$" {
        limit_req zone=watcher_starts burst=8 nodelay;
        limit_conn watcher_clients 4;
        include /etc/nginx/dnscheck/security-headers.conf;
        if ($http_connection !~* "(?:^|, *)upgrade(?:,|$)") {
            return 400;
        }
        if ($http_upgrade != "websocket") {
            return 400;
        }
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://unix:/var/lib/dnscheck/addrd.sock:;
        proxy_read_timeout 125s;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade "websocket";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Addr-Client-IP $remote_addr;
    }
}
server {
    include /etc/nginx/dnscheck/listen_http.conf;
    include /etc/nginx/dnscheck/listen_https.conf;
    server_name .test.dnscheck.tools          .test-ipv4.dnscheck.tools          .test-ipv6.dnscheck.tools
                .test-alg13.dnscheck.tools    .test-alg13-ipv4.dnscheck.tools    .test-alg13-ipv6.dnscheck.tools
                .test-alg14.dnscheck.tools    .test-alg14-ipv4.dnscheck.tools    .test-alg14-ipv6.dnscheck.tools
                .test-alg15.dnscheck.tools    .test-alg15-ipv4.dnscheck.tools    .test-alg15-ipv6.dnscheck.tools
                .test-alg18.dnscheck.tools    .test-alg18-ipv4.dnscheck.tools    .test-alg18-ipv6.dnscheck.tools
                badsig.go.dnscheck.tools      expiredsig.go.dnscheck.tools       nosig.go.dnscheck.tools;
    keepalive_requests 1;
    ssl_certificate /var/lib/dnscheck-certificates/live/addr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/addr.tools/privkey.pem;
    location = / {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Access-Control-Allow-Origin $dnscheck_probe_origin;
        add_header Vary "Origin";
        return 200 "Connected\n";
    }
    location / {
        return 404;
    }
}

