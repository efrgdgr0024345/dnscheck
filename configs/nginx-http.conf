        add_header Vary "Accept-Encoding";
    }
    location = /reg {
        include /etc/nginx/dnscheck/security-headers.conf;
        limit_req zone=addr_updates burst=10 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store";
        proxy_pass http://unix:/var/lib/dnscheck/addrd.sock:/myaddr-reg$is_args$args;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Addr-Client-IP $remote_addr;
    }
    location = /update {
        include /etc/nginx/dnscheck/security-headers.conf;
        limit_req zone=addr_updates burst=10 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store";
        proxy_pass http://unix:/var/lib/dnscheck/addrd.sock:/myaddr-update$is_args$args;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Addr-Client-IP $remote_addr;
    }
    location = /man.css {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/man.css;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }
    location ^~ /js/ {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/js/;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }

}

##
## myip.addr.tools
##
map $arg_key $myip_json_key {
    default ip;
    "~^[a-zA-Z_$][0-9a-zA-Z_$]*$" $arg_key;
}
server {
    include /etc/nginx/dnscheck/listen_http.conf;
    server_name myip.addr.tools myipv4.addr.tools myipv6.addr.tools;
    return 308 https://$host$request_uri;
}
server {
    include /etc/nginx/dnscheck/security-headers.conf;

    include /etc/nginx/dnscheck/listen_https.conf;
    server_name myip.addr.tools myipv4.addr.tools myipv6.addr.tools;
    root /srv/dnscheck/website/myip.addr.tools;
    ssl_certificate /var/lib/dnscheck-certificates/live/addr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/addr.tools/privkey.pem;
    location / {
        include /etc/nginx/dnscheck/security-headers.conf;
        try_files $uri $uri.html =404;
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }
    location = / {
        include /etc/nginx/dnscheck/security-headers.conf;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-store";
        return 200 "$remote_addr\n";
    }
    location = /plain {
        include /etc/nginx/dnscheck/security-headers.conf;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-store";
        return 200 $remote_addr;
    }
    location = /json {
        include /etc/nginx/dnscheck/security-headers.conf;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-store";
        default_type application/json;
        return 200 "{\"$myip_json_key\":\"$remote_addr\"}";
    }
    location = /pfsense {
        include /etc/nginx/dnscheck/security-headers.conf;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-store";
        default_type text/html;
        return 200 "<html><head><title>Current IP Check</title></head><body>Current IP Address: $remote_addr</body></html>\n";
    }
    location = /man.css {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/man.css;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }
    location ^~ /js/ {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/js/;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }

}
