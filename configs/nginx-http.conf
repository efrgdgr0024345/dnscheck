# Modified dnscheck deployment template, 2026-10-12. Original: Brian Shea / addr.tools.
# Include from nginx's http {} context. Replace ALL upstream domain/certificate
# names with domains you control. Copy companion snippets to /etc/nginx/dnscheck/.
# These are templates, not permission to serve or request certificates for addr.tools.
# Configure trusted CDN ranges with nginx real_ip explicitly if using a CDN;
# never trust a caller-supplied CF-Connecting-IP header on a public origin.
# Access logs omit source IPs, request URIs, query strings, bodies and credentials.
log_format dnscheck_safe '$time_iso8601 $server_name $request_method $status $body_bytes_sent';
access_log /var/log/nginx/dnscheck-access.log dnscheck_safe;
client_max_body_size 16k;
client_body_timeout 15s;
proxy_connect_timeout 3s;
proxy_read_timeout 20s;
limit_req_status 429;
limit_conn_status 429;
limit_req_zone $binary_remote_addr zone=addr_lookups:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=watcher_starts:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=watcher_clients:10m;
map $http_origin $dnscheck_probe_origin {
    default "";
    "https://dnscheck.tools" "https://dnscheck.tools";
}

limit_req_zone $binary_remote_addr zone=addr_updates:10m rate=1r/s;

##
## addr.tools
##
server {
    include /etc/nginx/dnscheck/security-headers.conf;

    include /etc/nginx/dnscheck/listen_https.conf;
    server_name addr.tools;
    root /srv/dnscheck/website/addr.tools;
    ssl_certificate /var/lib/dnscheck-certificates/live/addr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/addr.tools/privkey.pem;
    location / {
        include /etc/nginx/dnscheck/security-headers.conf;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }
    location /js/ {
        include /etc/nginx/dnscheck/security-headers.conf;
        try_files $uri $uri.js =404;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }
    location ~ "^/dns/[0-9A-Za-z._-]+/[0-9A-Za-z]+$" {
        include /etc/nginx/dnscheck/security-headers.conf;
        limit_req zone=addr_lookups burst=20 nodelay;
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
        proxy_pass http://unix:/var/lib/dnscheck/addrd.sock:;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Addr-Client-IP $remote_addr;
    }
    location = /man.css {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/man.css;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }

}
server {
    include /etc/nginx/dnscheck/security-headers.conf;

    include /etc/nginx/dnscheck/listen_https.conf;
    server_name www.addr.tools;
    ssl_certificate /var/lib/dnscheck-certificates/live/addr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/addr.tools/privkey.pem;
    location / {
        include /etc/nginx/dnscheck/security-headers.conf;
        add_header Cache-Control "max-age=2592000";
        return 301 https://addr.tools$request_uri;
    }
}

##
## challenges.addr.tools
##
server {
    include /etc/nginx/dnscheck/security-headers.conf;

    include /etc/nginx/dnscheck/listen_https.conf;
    server_name challenges.addr.tools;
    root /srv/dnscheck/website/challenges.addr.tools;
    ssl_certificate /var/lib/dnscheck-certificates/live/addr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/addr.tools/privkey.pem;
    location / {
        include /etc/nginx/dnscheck/security-headers.conf;
        try_files $uri $uri.html =404;
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }
    location = / {
        include /etc/nginx/dnscheck/security-headers.conf;
        try_files /help.html =404;
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
        if ($is_args = "?") {
            error_page 418 = @challenges;
            return 418;
        }
        if ($http_authorization != "") {
            error_page 418 = @challenges;
            return 418;
        }
        if ($request_method ~ ^(?:POST|PUT|DELETE)$) {
            error_page 418 = @challenges;
            return 418;
        }
    }
    location @challenges {
        include /etc/nginx/dnscheck/security-headers.conf;
        limit_req zone=addr_updates burst=100 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store";
        proxy_pass http://unix:/var/lib/dnscheck/addrd.sock:/challenges$is_args$args;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Addr-Client-IP $remote_addr;
    }
    location = /man.css {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/man.css;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }
    location ^~ /js/ {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/js/;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }

}

