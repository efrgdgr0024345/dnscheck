    include /etc/nginx/dnscheck/listen_https.conf;
    server_name myaddr.tools ipv4.myaddr.tools ipv6.myaddr.tools
                myaddr.dev   ipv4.myaddr.dev   ipv6.myaddr.dev
                myaddr.io    ipv4.myaddr.io    ipv6.myaddr.io;
    root /srv/dnscheck/website/myaddr.tools;
    ssl_certificate /var/lib/dnscheck-certificates/live/myaddr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/myaddr.tools/privkey.pem;
    location / {
