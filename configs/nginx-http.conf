##
## info.addr.tools
##
server {
    include /etc/nginx/dnscheck/security-headers.conf;

    include /etc/nginx/dnscheck/listen_https.conf;
    server_name info.addr.tools;
    root /srv/dnscheck/website/info.addr.tools;
    ssl_certificate /var/lib/dnscheck-certificates/live/addr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/addr.tools/privkey.pem;
    location ~ "\\.(?:html|js|css|ico|png|svg|txt)$" {
        include /etc/nginx/dnscheck/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }
    location ~ "^/(?:me)?$" {
        include /etc/nginx/dnscheck/security-headers.conf;
        add_header Cache-Control "no-store";
        return 302 https://info.addr.tools/$remote_addr;
    }
    location / {
        include /etc/nginx/dnscheck/security-headers.conf;
        try_files $uri $uri.html @info;
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }
    location @info {
        include /etc/nginx/dnscheck/security-headers.conf;
        try_files /info.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }
    location = /man.css {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/man.css;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }
    location ^~ /js/ {
        include /etc/nginx/dnscheck/security-headers.conf;
        alias /srv/dnscheck/website/addr.tools/js/;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }

    location ~ "^/dns/[0-9A-Za-z._-]+/[0-9A-Za-z]+$" {
        include /etc/nginx/dnscheck/security-headers.conf;
        limit_req zone=addr_lookups burst=20 nodelay;
        proxy_pass http://unix:/var/lib/dnscheck/addrd.sock:;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Addr-Client-IP $remote_addr;
    }

}

##
## myaddr.tools
##
server {
    include /etc/nginx/dnscheck/security-headers.conf;

    include /etc/nginx/dnscheck/listen_https.conf;
    server_name ~^www\.(?<myaddr_host>myaddr\.tools|myaddr\.dev|myaddr\.io)$;
    ssl_certificate /var/lib/dnscheck-certificates/live/myaddr.tools/fullchain.pem;
    ssl_certificate_key /var/lib/dnscheck-certificates/live/myaddr.tools/privkey.pem;
    location / {
        include /etc/nginx/dnscheck/security-headers.conf;
        add_header Cache-Control "max-age=2592000";
        return 301 https://$myaddr_host$request_uri;
    }
}
